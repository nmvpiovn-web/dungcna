<!doctype html>
<html lang="vi" class="overflow-x-hidden">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Title is set dynamically via <svelte:head> in +layout.svelte -->
		
		<!-- PWA & Mobile Meta Tags -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#059669" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Tiếng Anh Cô Dung" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		
		<!-- Typography -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
		
		<!-- Tailwind CSS Engine for Layout & Responsive Design -->
		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							// Academic Warmth design tokens (2026-09-30): utilities an theo CSS variable,
							// doi theo 2 theme Sáng / Xanh Nhẹ. Cam hardcode mau trong component moi.
							brand: {
								50: 'rgb(var(--brand-50-rgb) / <alpha-value>)',
								200: 'rgb(var(--brand-200-rgb) / <alpha-value>)',
								600: 'rgb(var(--brand-600-rgb) / <alpha-value>)',
								700: 'rgb(var(--brand-700-rgb) / <alpha-value>)'
							},
							// CX scale: mau chu dao tuy chinh qua CSS bien, Theme Studio dieu khien
							cx: {
								50: 'rgb(var(--c-50-rgb) / <alpha-value>)',
								100: 'rgb(var(--c-100-rgb) / <alpha-value>)',
								200: 'rgb(var(--c-200-rgb) / <alpha-value>)',
								300: 'rgb(var(--c-300-rgb) / <alpha-value>)',
								400: 'rgb(var(--c-400-rgb) / <alpha-value>)',
								500: 'rgb(var(--c-500-rgb) / <alpha-value>)',
								600: 'rgb(var(--c-600-rgb) / <alpha-value>)',
								700: 'rgb(var(--c-700-rgb) / <alpha-value>)',
								800: 'rgb(var(--c-800-rgb) / <alpha-value>)',
								900: 'rgb(var(--c-900-rgb) / <alpha-value>)',
								950: 'rgb(var(--c-950-rgb) / <alpha-value>)'
							},
							ink: {
								500: 'rgb(var(--ink-500-rgb) / <alpha-value>)',
								900: 'rgb(var(--ink-900-rgb) / <alpha-value>)'
							},
							surface: {
								0: 'rgb(var(--surface-0-rgb) / <alpha-value>)',
								1: 'rgb(var(--surface-1-rgb) / <alpha-value>)'
							},
							accent: {
								500: 'rgb(var(--accent-500-rgb) / <alpha-value>)'
							},
							success: {
								600: 'rgb(var(--success-600-rgb) / <alpha-value>)'
							},
							danger: {
								600: 'rgb(var(--danger-600-rgb) / <alpha-value>)'
							},
							line: 'rgb(var(--line-rgb) / <alpha-value>)'
						},
						fontFamily: {
							sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
							heading: ['Lexend', 'system-ui', 'sans-serif']
						}
					}
				}
			}
		</script>

		<!-- Instant Theme Initializer to prevent flash -->
		<script>
			(function() {
				try {
					const savedTheme = localStorage.getItem('tienganh_theme') || 'sky';
					document.documentElement.classList.remove('theme-sky');
					if (savedTheme === 'sky') {
						document.documentElement.classList.add('theme-sky');
					}
				} catch (e) {}
			})();
		</script>
		
		<!-- Global Busy / Dirty Registry & Safe PWA Registration -->
		<script>
			window.__appBusyRegistry = window.__appBusyRegistry || new Set();
			window.registerBusyState = function(id) {
				if (id) window.__appBusyRegistry.add(id);
				return function() { window.__appBusyRegistry.delete(id); };
			};
			window.unregisterBusyState = function(id) { window.__appBusyRegistry.delete(id); };
			window.isAppBusy = function() {
				if (window.__appBusyRegistry && window.__appBusyRegistry.size > 0) return true;
				if (window.__isExamActive) return true;
				if (window.location.pathname.startsWith('/exam') && !window.__isExamSubmitted) return true;
				if (window.__isRecordingActive) return true;
				if (window.__hasUnsavedChanges) return true;
				if (document.querySelector('form.dirty, input.dirty, textarea.dirty')) return true;
				return false;
			};
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-surface-1 text-ink-900 antialiased selection:bg-emerald-500 selection:text-white min-h-screen max-w-full overflow-x-hidden transition-colors duration-150">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
