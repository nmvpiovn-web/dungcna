<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Tiếng Anh Cô Dung - Hệ Thống Đào Tạo K12 &amp; Khảo Thí Quốc Tế</title>
		
		<!-- PWA & Mobile Meta Tags -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#0f172a" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Tiếng Anh Cô Dung" />
		<link rel="apple-touch-icon" href="/icon.svg" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		
		<!-- Typography -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
		
		<!-- Tailwind CSS Engine for Layout & Responsive Design -->
		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				darkMode: 'class',
				theme: {
					extend: {
						colors: {
							brand: {
								50: '#f0fdf4',
								100: '#dcfce7',
								200: '#bbf7d0',
								300: '#86efac',
								400: '#4ade80',
								500: '#22c55e',
								600: '#16a34a',
								700: '#15803d',
								800: '#166534',
								900: '#14532d'
							}
						},
						fontFamily: {
							sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
							heading: ['Lexend', 'system-ui', 'sans-serif']
						}
					}
				}
			}
		</script>

		<!-- Instant Theme Initializer to prevent flash -->
		<script>
			(function() {
				try {
					const savedTheme = localStorage.getItem('tienganh_theme') || 'sky';
					document.documentElement.classList.remove('dark', 'theme-sky');
					if (savedTheme === 'dark') {
						document.documentElement.classList.add('dark');
					} else if (savedTheme === 'sky') {
						document.documentElement.classList.add('theme-sky');
					}
				} catch (e) {}
			})();
		</script>
		
		<script>
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.addEventListener('controllerchange', () => {
					// Protect active exams, recordings, and unsaved form input from abrupt reloads
					const isBusy = window.__isExamActive ||
						(window.location.pathname.startsWith('/exam') && !window.__isExamSubmitted) ||
						window.__isRecordingActive ||
						window.__hasUnsavedChanges ||
						document.querySelector('form input:focus, form textarea:focus');

					if (isBusy) {
						// Dispatch non-disruptive update notification instead of destroying user input
						window.dispatchEvent(new CustomEvent('sw-update-available'));
						let banner = document.getElementById('sw-update-banner');
						if (!banner) {
							banner = document.createElement('div');
							banner.id = 'sw-update-banner';
							banner.className = 'fixed bottom-4 right-4 z-[9999] p-3 bg-slate-900/95 text-white border border-sky-500 rounded-lg shadow-2xl text-xs flex items-center gap-3 backdrop-blur-md animate-in fade-in';
							banner.innerHTML = '<span>⚡ Có bản cập nhật hệ thống mới. Vui lòng nộp bài / hoàn tất trước khi làm mới.</span> <button onclick="window.location.reload()" class="px-2.5 py-1 bg-sky-600 hover:bg-sky-500 text-white rounded font-bold shadow-xs">Làm Mới Ngay</button>';
							document.body.appendChild(banner);
						}
						return;
					}

					// Safe to reload idle page
					if (!window.__swReloading) {
						window.__swReloading = true;
						window.location.reload();
					}
				});
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js').then((reg) => {
						reg.update();
					}).catch(() => {});
				});
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-white min-h-screen max-w-full overflow-x-hidden transition-colors duration-150">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
