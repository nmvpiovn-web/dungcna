<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.8"/>
  <g transform="translate(96, 80)">
    <!-- Shield / Book Base -->
    <path d="M160 40 L280 80 L280 240 C280 320 160 380 160 380 C160 380 40 320 40 240 L40 80 Z" fill="url(#grad)" filter="url(#glow)"/>
    <!-- Inner Book Wings -->
    <path d="M160 140 C120 120 70 130 60 140 L60 270 C70 260 120 250 160 270 C200 250 250 260 260 270 L260 140 C250 130 200 120 160 140 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Center Quill / Graduation Star -->
    <polygon points="160,90 172,125 208,125 178,146 190,180 160,158 130,180 142,146 112,125 148,125" fill="#fbbf24"/>
    <!-- Text English Pro -->
    <text x="160" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">K12 &amp; IELTS</text>
  </g>
</svg>
