<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#059669" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <title>Mất kết nối — Tiếng Anh Cô Dung</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f0fdf4; color: #0f172a; padding: 24px;
    }
    .card {
      background: #fff; border: 1px solid #d1fae5; border-radius: 24px;
      padding: 40px 32px; max-width: 420px; width: 100%; text-align: center;
      box-shadow: 0 10px 30px rgba(5,150,105,.12);
    }
    .icon { font-size: 56px; margin-bottom: 12px; }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 20px; }
    .btn {
      display: inline-block; background: #059669; color: #fff; font-weight: 800;
      font-size: 15px; padding: 12px 28px; border-radius: 14px; border: 0; cursor: pointer;
    }
    .btn:active { transform: translateY(1px); }
    .home { display: block; margin-top: 12px; font-size: 13px; color: #059669; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Mất kết nối mạng</h1>
    <p>Thiết bị của bạn đang ngoại tuyến. Hãy kiểm tra Wi-Fi / 4G rồi thử lại — bài học và đề thi của bạn vẫn ở đây.</p>
    <button class="btn" onclick="location.reload()">🔄 Thử lại</button>
    <a class="home" href="/">← Về trang chủ</a>
  </div>
</body>
</html>
