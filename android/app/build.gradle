plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.edu.tienganhcodung.app'
    compileSdk 34

    defaultConfig {
        applicationId "vn.edu.tienganhcodung.app"
        minSdk 24
        targetSdk 34
        versionCode 220
        versionName "2.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
